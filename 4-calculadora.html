<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>


    <title>Rocketseat - React.js</title>

    <style>
        :root {
            --text: #EBEBEB;
            --text-secondary: #6B6B6B;
            --primary: #462878;
            --background: #2D2A37;

            --gradient: 180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.05) 100%
            --gradient-hover: 180deg, rgba(0, 0, 0, 0.05) 0%, rgba(255, 255, 255, 0.1) 100%

            
            --shadow: 0 11px 7px 0 rgba(0, 0, 0, 0.01),
                0 7px 7px 0 rgba(0, 0, 0, 0.04),
                0 4px 6px 0 rgba(0, 0, 0, 0.10),
                0 2px 4px 0 rgba(0, 0, 0, 0.26), 0 0 2px 0 rgba(0, 0, 0, 0.29),
                0 2px 3px 0 rgba(255, 255, 255, 0.06) inset;


            --font-sans: 'Rubik', sans-serif;
        }

        

    </style>

</head>
<body class="min-h-screen text-[var(--text)] bg-[linear-gradient(180deg,#807ECE_0%,#8E7ECE_100%)]">
    <div id="root"></div>


    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


     <script type="text/babel">
        const textVariants = {
            default: 'text-xl text-[var(--text)]',  
            muted: 'text-xl text-[var(--text-secondary)]',  
            heading: 'text-2xl',
            blast: 'text-3xl',
        }


        function Text( {
            as = 'span',
            variant = 'default',
            children,
            className,
            ...props
        }){
            return React.createElement(
                as, 
                {
                    className: `${textVariants[variant]} ${className ? className: ''}`,
                    ...props,
                },
                children
            ) 

        }

        const ButtonVariants = {
            default: 'bg-[var(--background)]',
            primary: 'bg-[var(--primary)]'
        }

        function Button( { variant = 'default', className, children, ...props}){
            return (<Text
             as="button"
             variant="heading"
            className={`
            flex items-center justify-center rounded-xl
            p-3 cursor-pointer text-[var(--text)]
            bg-[linear-gradient(180deg,rgba(0,0,0,0.05)0%,rgba(255,255,255,0.05)100%)]
            hover:bg-[linear-gradient(180deg,rgba(0,0,0,0.05)0%,rgba(255,255,255,0.1)100%)]
            shadow-[var(--shadow)]
            ${ButtonVariants[variant]}
            ${className ? className : ''}
            `}
             {...props}>
             {children}
             </Text>
            )
        }
        

        function Card( { children, className, ...props}){
            return (
                <div className={`
                    bg-[var(--background)] shadow-[var(--shadow)] rounded-2xl
                    ${className ? className : ''}
                    `}>
                    {children}
                    </div> 
            )
        }

        function CalculatorDisplay( {operation, result }){
            return (
                <div classsName={`
                        flex flex-col gap-2 px-[1.375rem]
                        cursor-default select-none
                        `}>
                        <Text as="div" variant="muted" className= "flex items-center justify-end">
                       {operation}
                          
                        </Text>

                    <div className="flex items-center justify-between">
                        
                    <Text variant="muted">=</Text>
                    <Text variant="blast">{result}</Text>
                        

                    </div>

                        </div>

            )
        }

        function Calculator(){
            
            return (
                <Card className={`
                    flex flex-col gap-[1.625rem] w-[22.5rem]
                    pt-14 px-8 pb-8 
                    
                    `}>

                   <CalculatorDisplay operation="2 + 2" result="4"/>
                   <div className="flex gap-3">
                    <Button className="w-16 h-16">CE</Button>
                    <Button className="flex-1 w-16 h-16">C</Button>
                    <Button className="w-16 h-16" variant="primary">/</Button>
                  </div>
                   <div className="flex gap-3">
                    <Button className="w-16 h-16">7</Button>
                    <Button className="w-16 h-16">8</Button>
                    <Button className="w-16 h-16">9</Button>
                    <Button className="w-16 h-16" variant="primary">/</Button>
                  </div>
                   <div className="flex gap-3">
                    <Button className="w-16 h-16">4</Button>
                    <Button className="w-16 h-16">5</Button>
                    <Button className="w-16 h-16">6</Button>
                    <Button className="w-16 h-16" variant="primary">-</Button>
                  </div>
                   <div className="flex gap-3">
                    <Button className="w-16 h-16">1</Button>
                    <Button className="w-16 h-16">2</Button>
                    <Button className="w-16 h-16">3</Button>
                    <Button className="w-16 h-16" variant="primary">+</Button>
                  </div>
                   <div className="flex gap-3">
                    <Button className="flex-1 w-16 h-16">0</Button>
                    <Button className="w-16 h-16">,</Button>
                    <Button className="w-16 h-16" variant="primary">=</Button>
                  </div>
                </Card>

            )
        }


        function OperationHistory(){
            return (
            <Card className="py-10 px-8 w-full">
                <Text as="h1" variant="heading" className="mb-4">
                Histórico de Operações    
                </Text>
                
            <ul className="flex flex-col gap-2">
            <Text as="li">1 + 1 = 2</Text>    
            <Text as="li">2 + 3 + 1 = 6</Text>    
            <Text as="li">2 + 3 = 5</Text>    
            </ul>
                
            </Card>

            )
        }

        function App(){
            return (
                <main className="py-28 px-4 sm:px-10 flex flex-col sm:flex-row items-center sm:items-stretch gap-2">
         
                    <Calculator/>
                    <OperationHistory/>


                </main>
            )
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />)

     </script>
        
</body>
</html>
