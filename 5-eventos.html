<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketseat - React.js</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
     <script type="text/babel">
         

     
     function Alert1(){
        function handleClickAlert(event){
            console.log(event);
            alert('Alerta 1');
        }


        return (

            <button type="button" onClick={handleClickAlert}>
                Mostrar o Alerta
            </button>

        )

     }


     function Alert2(){
        function handleClickAlert(msg){
            return alert(msg)
        }

        return (
        <button type="button" onClick={() => handleClickAlert('Alerta 2')}>
            Mostrar Alerta com parametro

        </button>

        )
        function handleInputChange(event){
          console.log(event.target.value);
       }
     }

    function Alert3(){
        function handleClickAlert(event){
        alert(event.target.previousSibling.value);
    }  
        function handleInputChange(event) {
        console.log(event.target.value);
    }
    return (
     <div>
        <input type="text" placeholder="Digite algo" onChange={handleInputChange} />
        <button onClick={handleClickAlert}> Envia resultado</button>

        </div>
    )
    }   



    function App(){
         return (
            <main >
            <Alert1 />
            <Alert2 />
            <Alert3 />
            </main>
                
            )
        }
        
        
        ReactDOM.createRoot(document.getElementById('root')).render( <App /> )


     </script>


</body>
</html>
